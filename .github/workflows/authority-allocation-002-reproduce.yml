name: AUTHORITY-ALLOCATION-002-REPRODUCE

# Historical post-open provenance workflow.
# The scientific design/executable were frozen at
# 753db01c05c1ecdaa4f2c0602a3bacb8c92c695d before confirmatory seeds were opened.
# Hosted reproduction completed successfully in workflow run 32582018804.
# This workflow is intentionally left non-triggering after custody closure.

on:
  workflow_dispatch:

jobs:
  reproduce-confirmatory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen executable Git blob
        run: |
          test "$(git hash-object experiments/authority_allocation_002/authority_allocation_002.py)" = "3c674342ba0cfc9f9ecfdb3bbb6dca5ff38ca40b"

      - name: Reproduce frozen confirmatory block
        run: |
          python experiments/authority_allocation_002/authority_allocation_002.py \
            --mode confirmatory \
            --seed-start 20000 \
            --num-seeds 256 \
            --out authority_allocation_002_result.json

      - name: Print preregistered result surface
        run: |
          python - <<'PY'
          import json
          p = json.load(open('authority_allocation_002_result.json'))
          print(json.dumps({
              'experiment_id': p['experiment_id'],
              'status': p['status'],
              'seed_start': p['seed_start'],
              'num_seeds': p['num_seeds'],
              'primary': p['summary']['primary'],
              'apparatus': p['summary']['apparatus'],
              'surface': p['summary']['surface'],
              'paired_placement': p['summary']['paired_placement'],
          }, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: authority-allocation-002-result
          path: authority_allocation_002_result.json
          if-no-files-found: error
